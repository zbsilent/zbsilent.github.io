<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="青森的个人主页：做工具，记录观察，保持好奇。">
    <title>青森｜把想法做出来</title>
    <link rel="stylesheet" href="./styles-v2.css?v=single-page-v1">
    <link rel="stylesheet" href="./styles-interaction.css?v=single-page-v1">
  </head>
  <body>
    <a class="skip-link" href="#content">跳到主要内容</a>
    <header class="site-header">
      <a class="brand" href="#content">青森<span>®</span></a>
      <p class="single-page-label">ENGINEER / DESIGNER / OPEN-SOURCE</p>
      <a class="contact-link" href="mailto:zbsilent@gmail.com">联系 <span aria-hidden="true">↗</span></a>
    </header>
    <main id="content">
      <section class="hero page-section" aria-label="青森个人主页">
        <div class="hero-scene">
          <div class="hero-copy reveal">
            <p class="kicker">设计 / 工程 / 好奇心</p>
            <h1>把想法<br><em>做出来。</em></h1>
            <p class="hero-summary">做小工具，写下观察，也给一只猫留点位置。</p>
            <p class="hero-caption">一个人的工作台，正在发生。</p>
          </div>
          <div class="hero-visual reveal" aria-label="人物和猫咪插画，会对鼠标方向作出反应">
            <div class="visual-grid" aria-hidden="true"></div>
            <div class="visual-orbit" aria-hidden="true"></div>
            <div class="character-frame">
              <img class="character" src="./assets/character-base-cutout.png" alt="戴眼镜的卡通人物">
              <img class="iris iris-a" src="./assets/iris-left.png" alt="">
              <img class="iris iris-b" src="./assets/iris-right.png" alt="">
            </div>
            <div class="cat-layer"><img src="./assets/cat-full-ai.png" alt="一只会随鼠标转头的猫"><span class="cat-shadow" aria-hidden="true"></span></div>
            <span class="visual-note">FOCUS<br>BUILD<br>CREATE.</span>
            <span class="visual-index">01 / 01</span>
          </div>
        </div>
      </section>
    </main>
    <footer><span>© 2026 青森</span><span>保持好奇 · 慢慢做</span></footer>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="./script-v2.js?v=single-page-v1"></script>
  </body>
</html>
